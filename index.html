<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인증 워터마크</title>
<style>
:root{
  --bg:#f6f6f8; --card:#fff; --text:#1c1c22; --sub:#6d6d78; --line:#e2e2e8;
  --accent:#6c5ce7; --accent-t:#fff; --drop:#fafaff;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141418; --card:#1e1e25; --text:#ececf1; --sub:#9a9aa8; --line:#32323c; --drop:#1a1a22; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 14px}
h1 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media (max-width:760px){ .grid{grid-template-columns:1fr} .preview{order:-1} }
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{margin-bottom:14px}
.row:last-child{margin-bottom:0}
label.t{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px}
label.t b{color:var(--text);font-weight:600}
input[type=text],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px}
input[type=text]:focus,input[type=number]:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=range]{display:block;width:calc(100% - 48px);margin:8px 24px;accent-color:var(--accent);touch-action:pan-y}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px;border:0;background:transparent;color:var(--text);font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-t)}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.colors{display:flex;align-items:center;gap:8px}
.colors input[type=color]{width:42px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:90px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.mini{padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap}
.inl{display:flex;gap:8px;align-items:stretch}
.inl .lb{flex:0 0 auto;display:flex;align-items:center;font-size:13px;color:var(--sub);width:32px}
.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.sec{font-size:13px;font-weight:700;margin:0 0 12px}
.drop{border:2px dashed var(--line);background:var(--drop);border-radius:14px;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub);padding:24px;cursor:pointer}
.drop.over{border-color:var(--accent)}
.drop strong{color:var(--text);font-size:16px;display:block;margin-bottom:6px}
.stage{display:none;text-align:center}
.stage canvas{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:repeating-conic-gradient(#8883 0 25%,#0000 0 50%) 0 0/16px 16px}
.meta{font-size:12px;color:var(--sub);margin-top:8px}
.again{margin-top:10px;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;text-decoration:underline}
.note{font-size:12px;color:var(--sub);margin-top:12px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.gifres{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.gifres img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:.95}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>인증 워터마크<small>스밍·소장 인증용 · 브라우저 안에서만 처리돼요</small></h1>

  <div class="grid">
    <div class="card controls">
      <div class="row">
        <label class="t"><span>아이디 / 문구</span></label>
        <input type="text" id="text" placeholder="@내아이디" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="checks" style="margin-top:8px">
          <label><input type="checkbox" id="date"> 날짜·시간 같이 표시</label>
        </div>
      </div>

      <div class="row">
        <label class="t"><span>배치</span></label>
        <div class="seg" id="mode">
          <button data-v="tile" class="on">전체 반복</button>
          <button data-v="single">한 곳에만</button>
        </div>
      </div>

      <div class="row hide" id="posRow">
        <label class="t"><span>위치</span></label>
        <select id="pos">
          <option value="tl">왼쪽 위</option>
          <option value="tc">위 가운데</option>
          <option value="tr">오른쪽 위</option>
          <option value="ml">왼쪽 가운데</option>
          <option value="mc">정중앙</option>
          <option value="mr">오른쪽 가운데</option>
          <option value="bl">왼쪽 아래</option>
          <option value="bc">아래 가운데</option>
          <option value="br" selected>오른쪽 아래</option>
        </select>
      </div>

      <div class="row">
        <label class="t"><span>글자 크기</span><b id="sizeV"></b></label>
        <input type="range" id="size" min="1.5" max="12" step="0.5" value="4">
      </div>
      <div class="row">
        <label class="t"><span>투명도</span><b id="opV"></b></label>
        <input type="range" id="op" min="5" max="100" step="5" value="40">
      </div>
      <div class="row">
        <label class="t"><span>각도</span><b id="angleV"></b></label>
        <input type="range" id="angle" min="-90" max="90" step="5" value="-25">
      </div>
      <div class="row" id="gapRow">
        <label class="t"><span>간격</span><b id="gapV"></b></label>
        <input type="range" id="gap" min="0.5" max="6" step="0.5" value="2">
      </div>

      <div class="row">
        <label class="t"><span>색상</span></label>
        <div class="colors">
          <input type="color" id="color" value="#ffffff">
          <button class="sw" style="background:#fff" data-c="#ffffff" title="흰색"></button>
          <button class="sw" style="background:#000" data-c="#000000" title="검정"></button>
          <button class="sw" style="background:#ff3b5c" data-c="#ff3b5c" title="빨강"></button>
          <button class="sw" style="background:#ffe14d" data-c="#ffe14d" title="노랑"></button>
        </div>
      </div>

      <div class="row">
        <div class="checks">
          <label><input type="checkbox" id="bold" checked> 굵게</label>
          <label><input type="checkbox" id="stroke" checked> 외곽선</label>
        </div>
      </div>

      <!-- 이미지 출력 -->
      <div id="imgOut">
        <hr class="sep">
        <div class="row">
          <label class="t"><span>저장 형식</span></label>
          <div class="seg" id="fmt">
            <button data-v="png" class="on">PNG</button>
            <button data-v="jpeg">JPG</button>
          </div>
        </div>
        <div class="row btns">
          <button class="btn primary" id="save" disabled>저장</button>
          <button class="btn" id="copy" disabled>복사</button>
          <button class="btn hide" id="share" disabled>공유</button>
        </div>
      </div>

      <!-- 영상 → GIF 출력 -->
      <div id="gifOut" class="hide">
        <hr class="sep">
        <p class="sec">GIF 변환</p>
        <div class="row">
          <label class="t"><span>GIF 너비</span><b id="gwV"></b></label>
          <select id="gw">
            <option value="240">240px (가벼움)</option>
            <option value="320">320px</option>
            <option value="400">400px</option>
            <option value="480">480px (추천)</option>
            <option value="540">540px</option>
            <option value="640">640px</option>
            <option value="720">720px (무거움)</option>
          </select>
        </div>
        <div class="row">
          <label class="t"><span>FPS</span><b id="fpsV"></b></label>
          <input type="range" id="fps" min="5" max="20" step="1" value="10">
        </div>
        <div class="row">
          <div class="checks"><label><input type="checkbox" id="flow"> 워터마크 흐르게 하기</label></div>
        </div>
        <div id="flowOpts" class="hide">
          <div class="row">
            <div class="checks"><label><input type="checkbox" id="cover"> 빈틈없이 훑기 (모든 위치를 한 번 이상 지나감)</label></div>
          </div>
          <div class="row" id="flowSpRow">
            <label class="t"><span>흐르는 속도</span><b id="flowSpV"></b></label>
            <input type="range" id="flowSp" min="2" max="40" step="1" value="12">
          </div>
          <div class="row">
            <label class="t"><span>방향</span></label>
            <div class="seg" id="flowDir">
              <button data-v="-1">← 왼쪽</button>
              <button data-v="1">오른쪽 →</button>
            </div>
          </div>
        </div>
        <div class="row">
          <label class="t"><span>구간 (초)</span></label>
          <div class="inl" style="margin-bottom:8px">
            <span class="lb">시작</span>
            <input type="number" id="gStart" step="0.1" min="0" inputmode="decimal">
            <button class="mini" id="setStart" type="button">현재 위치</button>
          </div>
          <div class="inl">
            <span class="lb">끝</span>
            <input type="number" id="gEnd" step="0.1" min="0" inputmode="decimal">
            <button class="mini" id="setEnd" type="button">현재 위치</button>
          </div>
          <div class="meta" id="gInfo"></div>
        </div>
        <div class="row btns">
          <button class="btn primary" id="mkGif">GIF 만들기</button>
        </div>
        <div class="row hide" id="progBox">
          <div class="prog"><i id="bar"></i></div>
          <div class="meta" id="progT"></div>
          <div class="btns" style="margin-top:8px"><button class="btn" id="cancelGif">취소</button></div>
        </div>
      </div>

      <p class="note">설정과 아이디는 이 브라우저에 저장돼요. 이미지·영상은 서버로 전송되지 않아요.</p>
    </div>

    <div class="card preview">
      <div class="drop" id="drop">
        <strong>스크린샷 또는 화면 녹화 영상을 선택하세요</strong>
        여기를 눌러 고르거나, 끌어다 놓거나, 이미지는 붙여넣기(Ctrl/⌘+V)도 돼요.
        <input type="file" id="file" accept="image/*,video/*" hidden>
      </div>
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="meta" id="meta"></div>

        <div id="scrubRow" class="hide" style="margin-top:10px">
          <input type="range" id="scrub" min="0" max="1" step="0.05" value="0">
          <div class="meta" id="tcur"></div>
        </div>

        <button class="again" id="again">다른 파일 선택</button>

        <div class="gifres hide" id="gifRes">
          <img id="gifImg" alt="완성된 GIF">
          <div class="meta" id="gifMeta"></div>
          <div class="btns" style="margin-top:10px">
            <button class="btn primary" id="gifDl">GIF 다운로드</button>
            <button class="btn hide" id="gifShare">공유</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'wm_settings_v1';
  const FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
  const MAX_FRAMES = 600;
  const S = { text:'', date:false, mode:'tile', pos:'br', size:4, op:40, angle:-25, gap:2, color:'#ffffff', bold:true, stroke:true, fmt:'png', gw:480, fps:10, flow:false, flowSp:12, flowDir:1, cover:true };

  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

  let src = null;            // 현재 원본 (Image 또는 video)
  let kind = 'image';        // 'image' | 'video'
  let fileName = 'image';
  let objUrl = null, gifUrl = null, gifBlob = null;
  let exporting = false, cancelFlag = false;
  const cv = $('cv'), ctx = cv.getContext('2d');

  // 영상 디코딩용 숨김 video
  const video = document.createElement('video');
  video.muted = true; video.playsInline = true; video.preload = 'auto';
  video.setAttribute('playsinline', '');
  video.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
  document.body.appendChild(video);

  /* ---------- 슬라이더 오터치 방지 ----------
     터치로 동그라미(엄지) 근처를 잡았을 때만 값이 바뀜.
     줄의 다른 곳을 눌러 값이 튀면 바로 원래 값으로 되돌림. */
  document.querySelectorAll('input[type=range]').forEach(el => {
    let blocked = false, prev = '';
    el.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch') { blocked = false; return; }
      const r = el.getBoundingClientRect();
      const min = parseFloat(el.min) || 0, max = parseFloat(el.max) || 100;
      const frac = max > min ? (parseFloat(el.value) - min) / (max - min) : 0;
      const TW = 28;                                          // 엄지 대략 너비
      const thumbX = r.left + TW / 2 + frac * (r.width - TW);
      blocked = Math.abs(e.clientX - thumbX) > 36;
      prev = el.value;
    }, true);
    el.addEventListener('input', e => {
      if (!blocked) return;
      e.stopImmediatePropagation();
      el.value = prev;
    }, true);
    ['pointerup', 'pointercancel'].forEach(t => el.addEventListener(t, () => { blocked = false; }, true));
  });

  /* ---------- UI <-> state ---------- */
  function syncUI(){
    $('text').value = S.text;
    $('date').checked = S.date;
    $('pos').value = S.pos;
    $('size').value = S.size; $('op').value = S.op; $('angle').value = S.angle; $('gap').value = S.gap;
    $('color').value = S.color;
    $('bold').checked = S.bold; $('stroke').checked = S.stroke;
    $('gw').value = String(S.gw); $('fps').value = S.fps;
    $('flow').checked = S.flow; $('flowSp').value = S.flowSp; $('cover').checked = S.cover;
    setSeg('mode', S.mode); setSeg('fmt', S.fmt); setSeg('flowDir', String(S.flowDir));
    labels();
  }
  function labels(){
    $('sizeV').textContent = S.size;
    $('opV').textContent = S.op + '%';
    $('angleV').textContent = S.angle + '°';
    $('gapV').textContent = S.gap;
    $('fpsV').textContent = S.fps;
    $('gwV').textContent = S.gw + 'px';
    $('flowSpV').textContent = S.flowSp + '%/초';
    $('flowOpts').classList.toggle('hide', !S.flow);
    $('flowSpRow').classList.toggle('hide', S.cover);
    const tile = S.mode === 'tile';
    $('posRow').classList.toggle('hide', tile);
    $('gapRow').classList.toggle('hide', !tile);
  }
  function setSeg(id, v){
    document.querySelectorAll('#'+id+' button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  }

  $('text').addEventListener('input', e => { S.text = e.target.value; changed(); });
  $('date').addEventListener('change', e => { S.date = e.target.checked; changed(); });
  $('pos').addEventListener('change', e => { S.pos = e.target.value; changed(); });
  ['size','op','angle','gap'].forEach(k => $(k).addEventListener('input', e => { S[k] = parseFloat(e.target.value); changed(); }));
  $('color').addEventListener('input', e => { S.color = e.target.value; changed(); });
  document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => { S.color = b.dataset.c; $('color').value = S.color; changed(); }));
  $('bold').addEventListener('change', e => { S.bold = e.target.checked; changed(); });
  $('stroke').addEventListener('change', e => { S.stroke = e.target.checked; changed(); });
  document.querySelectorAll('#mode button').forEach(b => b.addEventListener('click', () => {
    S.mode = b.dataset.v;
    S.angle = S.mode === 'tile' ? -25 : 0;
    $('angle').value = S.angle;
    setSeg('mode', S.mode); changed();
  }));
  document.querySelectorAll('#fmt button').forEach(b => b.addEventListener('click', () => { S.fmt = b.dataset.v; setSeg('fmt', S.fmt); save(); }));
  $('gw').addEventListener('change', e => { S.gw = parseInt(e.target.value, 10); labels(); save(); updateInfo(); });
  $('fps').addEventListener('input', e => { S.fps = parseInt(e.target.value, 10); labels(); save(); updateInfo(); });
  $('flow').addEventListener('change', e => { S.flow = e.target.checked; changed(); });
  $('flowSp').addEventListener('input', e => { S.flowSp = parseInt(e.target.value, 10); changed(); });
  $('cover').addEventListener('change', e => { S.cover = e.target.checked; changed(); });
  document.querySelectorAll('#flowDir button').forEach(b => b.addEventListener('click', () => {
    S.flowDir = parseInt(b.dataset.v, 10); setSeg('flowDir', String(S.flowDir)); changed();
  }));

  let raf = 0;
  function changed(){ labels(); save(); updateInfo(); cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }

  /* ---------- 워터마크 그리기 ---------- */
  function pad(n){ return String(n).padStart(2,'0'); }
  function stamp(){
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function isLight(hex){
    const n = parseInt(hex.slice(1), 16);
    const r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    return (0.299*r + 0.587*g + 0.114*b) > 150;
  }

  const wrap = (v, m) => ((v % m) + m) % m;

  // 문구 크기·간격 계산 (그리기와 커버리지 계산에서 같이 씀)
  function metrics(c, s, W, H, st){
    const lines = [];
    if (s.text.trim()) s.text.split('\n').forEach(l => l.trim() && lines.push(l.trim()));
    if (s.date) lines.push(st);
    if (!lines.length) return null;
    const fs = W * s.size / 100;
    const lh = fs * 1.25;
    c.save();
    c.font = `${s.bold ? '700' : '400'} ${fs}px ${FONT}`;
    const widths = lines.map(l => c.measureText(l).width);
    const mw = Math.max(...widths), mwMin = Math.min(...widths);
    c.restore();
    const blockH = lines.length * lh;
    return { lines, fs, lh, mw, mwMin, blockH, gx: mw + fs * s.gap, gy: blockH + fs * s.gap };
  }

  // GIF 전체 길이 동안 모든 위치를 한 번 이상 훑는 경로
  // 가로로 여러 번 훑으면서 세로로 한 번 천천히 내려가는 래스터 방식.
  // 프레임은 띄엄띄엄이라서, 어떤 점이 세로 범위 안에 들어와 있는 프레임 수(mmin)와
  // 그 사이 가로 이동량(<= 글자 너비의 90%)으로 빈틈이 없는지 계산해요.
  function coverPlan(m, s, W, H){
    const w = m.mwMin, h = m.blockH;           // 모든 줄이 공통으로 덮는 사각형
    const STEP = 0.9;                          // 프레임 사이 가로 이동 <= 너비의 90%
    let period, Dy, Rx, ext = {};
    if (s.mode === 'tile') { period = m.gx; Dy = m.gy + m.blockH; Rx = m.gx; }
    else {
      const th = s.angle * Math.PI / 180, ca = Math.abs(Math.cos(th)), sa = Math.abs(Math.sin(th));
      const ex = (W * ca + H * sa) / 2, ey = (W * sa + H * ca) / 2;   // 회전 좌표계에서 화면이 차지하는 반폭/반높이
      Rx = 2 * ex + m.mw + m.fs * 2; period = Rx; Dy = 2 * ey + m.blockH;
      ext = { ex, ey };
    }
    const mminReq = Math.max(1, Math.ceil(1 + (period - w) / (STEP * w)));
    const need = Math.ceil(Dy * mminReq / h) + 1;
    const K = STEP * (need - 1) * w / period;  // 전체 구간 동안 가로로 훑는 횟수
    return { K, Dy, Rx, need, ...ext };
  }

  // c: 2d context, el: Image|video, W/H: 출력 크기, s: 설정 스냅샷, st: 날짜 문자열
  // t: 흐름 애니메이션 시간(초, 없으면 정지), pr: GIF 진행도 0~1 (빈틈없이 훑기용)
  function paint(c, el, W, H, s, st, t, pr){
    c.clearRect(0, 0, W, H);
    c.drawImage(el, 0, 0, W, H);

    const m = metrics(c, s, W, H, st);
    if (!m) return;
    const { lines, fs, lh, mw, blockH, gx, gy } = m;

    c.save();
    c.font = `${s.bold ? '700' : '400'} ${fs}px ${FONT}`;
    c.textBaseline = 'middle';
    c.lineJoin = 'round';
    c.globalAlpha = s.op / 100;
    c.fillStyle = s.color;
    c.strokeStyle = isLight(s.color) ? '#000000' : '#ffffff';
    c.lineWidth = Math.max(2, fs * 0.14);

    const rad = s.angle * Math.PI / 180;
    const flowing = !!s.flow && t != null;
    const cover = flowing && !!s.cover && pr != null;
    const plan = cover ? coverPlan(m, s, W, H) : null;
    const dist = flowing && !cover ? t * s.flowSp * W / 100 * s.flowDir : 0;

    const drawBlock = (cx, cy, align) => {
      c.textAlign = align;
      lines.forEach((l, i) => {
        const y = cy + (i - (lines.length - 1) / 2) * lh;
        if (s.stroke) c.strokeText(l, cx, y);
        c.fillText(l, cx, y);
      });
    };

    if (s.mode === 'tile') {
      const diag = Math.hypot(W, H);
      let dx, dy = 0;
      if (cover) { dx = wrap(s.flowDir * pr * plan.K * gx, gx); dy = pr * plan.Dy; }
      else dx = wrap(dist, gx);
      c.translate(W / 2, H / 2);
      c.rotate(rad);
      let r = 0;
      for (let y = -diag / 2 - 2 * gy - blockH + dy; y <= diag / 2 + gy; y += gy, r++) {
        const off = (r % 2) * gx / 2;
        for (let x = -diag / 2 - 2 * gx; x <= diag / 2 + gx; x += gx) drawBlock(x + off + dx, y, 'center');
      }
    } else {
      const mg = fs * 0.8;
      const p = s.pos;
      let x, y, align;
      if (p[1] === 'l') { x = mg; align = 'left'; }
      else if (p[1] === 'r') { x = W - mg; align = 'right'; }
      else { x = W / 2; align = 'center'; }
      if (p[0] === 't') y = mg + blockH / 2;
      else if (p[0] === 'b') y = H - mg - blockH / 2;
      else y = H / 2;
      if (flowing) {
        align = 'center';
        if (cover) {
          // 각도가 있어도 빈틈없도록, 회전 좌표계에서 화면 전체를 훑음
          c.translate(W / 2, H / 2);
          c.rotate(rad);
          drawBlock(-plan.ex - mw / 2 - fs + wrap(s.flowDir * pr * plan.K * plan.Rx, plan.Rx),
                    -plan.ey - blockH / 2 + pr * plan.Dy, 'center');
          c.restore();
          return;
        } else {
          x = -mw / 2 - fs + wrap(dist, W + mw + fs * 2);
        }
      }
      c.translate(x, y);
      c.rotate(rad);
      drawBlock(0, 0, align);
    }
    c.restore();
  }

  function render(){
    if (!src) return;
    let W, H;
    if (kind === 'video') {
      W = Math.min(video.videoWidth, 720);
      H = Math.round(W * video.videoHeight / video.videoWidth);
    } else {
      W = src.naturalWidth; H = src.naturalHeight;
    }
    cv.width = W; cv.height = H;
    let pv, pp;
    if (kind === 'video') {
      const a = parseFloat($('gStart').value) || 0, b = parseFloat($('gEnd').value) || 0;
      pv = Math.max(0, video.currentTime - a);
      pp = b > a ? Math.min(1, pv / (b - a)) : 0;
    }
    paint(ctx, src, W, H, S, stamp(), pv, pp);
  }

  /* ---------- 파일 로딩 ---------- */
  function showStage(){
    $('drop').style.display = 'none';
    $('stage').style.display = 'block';
  }
  function setKind(k){
    kind = k;
    $('imgOut').classList.toggle('hide', k !== 'image');
    $('gifOut').classList.toggle('hide', k !== 'video');
    $('scrubRow').classList.toggle('hide', k !== 'video');
    if (k !== 'video') clearGif();
  }
  function baseName(f){ return (f.name || 'file').replace(/\.[^.]+$/, '') || 'file'; }

  function loadFile(f){
    if (!f) return;
    if (exporting) return toast('GIF 변환 중에는 파일을 바꿀 수 없어요');
    if (f.type.startsWith('video/')) return loadVideo(f);
    if (f.type.startsWith('image/')) return loadImage(f);
    toast('이미지나 영상 파일이 아니에요');
  }

  function loadImage(f){
    fileName = baseName(f);
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      src = im;
      setKind('image');
      showStage();
      ['save','copy','share'].forEach(id => $(id).disabled = false);
      $('meta').textContent = `${im.naturalWidth} × ${im.naturalHeight}px`;
      render();
    };
    im.onerror = () => { URL.revokeObjectURL(url); toast('이미지를 불러오지 못했어요'); };
    im.src = url;
  }

  function loadVideo(f){
    fileName = baseName(f);
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(f);
    video.onloadedmetadata = () => {
      const dur = video.duration;
      if (!video.videoWidth || !isFinite(dur) || dur <= 0) { toast('이 영상은 길이를 읽을 수 없어요'); return; }
      src = video;
      setKind('video');
      showStage();
      $('scrub').max = dur;
      $('scrub').value = 0;
      $('gStart').value = '0.0';
      $('gEnd').value = Math.min(dur, 10).toFixed(1);
      $('meta').textContent = `${video.videoWidth} × ${video.videoHeight}px · ${dur.toFixed(1)}초`;
      updateInfo();
      video.currentTime = Math.min(0.05, dur / 2);
    };
    video.onerror = () => toast('이 영상 형식은 브라우저에서 열 수 없어요');
    video.src = objUrl;
    video.load();
  }

  video.addEventListener('seeked', () => {
    if (exporting || kind !== 'video') return;
    $('scrub').value = video.currentTime;
    $('tcur').textContent = `미리보기 ${video.currentTime.toFixed(1)}초 / ${video.duration.toFixed(1)}초`;
    render();
  });
  $('scrub').addEventListener('input', e => { if (!exporting) video.currentTime = parseFloat(e.target.value); });

  const drop = $('drop');
  drop.addEventListener('click', () => $('file').click());
  $('again').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
  ['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  document.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
  document.addEventListener('paste', e => {
    const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (it) loadFile(it.getAsFile());
  });

  /* ---------- 이미지 출력 ---------- */
  function toBlob(){
    const type = S.fmt === 'jpeg' ? 'image/jpeg' : 'image/png';
    return new Promise(res => cv.toBlob(res, type, 0.95));
  }
  function outName(){ return `${fileName}_wm.${S.fmt === 'jpeg' ? 'jpg' : 'png'}`; }
  function download(url, name){
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  $('save').addEventListener('click', async () => {
    const b = await toBlob();
    if (!b) return toast('저장에 실패했어요');
    const u = URL.createObjectURL(b);
    download(u, outName());
    setTimeout(() => URL.revokeObjectURL(u), 2000);
    toast('저장했어요');
  });

  $('copy').addEventListener('click', async () => {
    try {
      const b = await new Promise(res => cv.toBlob(res, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]);
      toast('클립보드에 복사했어요');
    } catch(e) { toast('이 브라우저에선 복사가 안 돼요. 저장을 이용해주세요'); }
  });

  const canShareFiles = (() => {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] })); }
    catch(e){ return false; }
  })();
  if (canShareFiles) { $('share').classList.remove('hide'); $('gifShare').classList.remove('hide'); }
  $('share').addEventListener('click', async () => {
    try {
      const b = await toBlob();
      await navigator.share({ files: [new File([b], outName(), { type: b.type })] });
    } catch(e) { if (e.name !== 'AbortError') toast('공유에 실패했어요'); }
  });

  /* =====================================================
     GIF 인코더 (외부 라이브러리 없음)
     - 전역 팔레트(median cut, 255색) + 인덱스 255 = 투명
     - 이전 프레임과 같은 픽셀은 투명 처리해서 용량 절약
     ===================================================== */
  function buildPalette(datas){
    const cnt = new Uint32Array(32768);
    const sr = new Float64Array(32768), sg = new Float64Array(32768), sb = new Float64Array(32768);
    for (const d of datas) {
      for (let i = 0; i < d.length; i += 16) {          // 4픽셀마다 샘플링
        const r = d[i], g = d[i+1], b = d[i+2];
        const k = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
        cnt[k]++; sr[k] += r; sg[k] += g; sb[k] += b;
      }
    }
    const keys = []; let total = 0;
    for (let k = 0; k < 32768; k++) if (cnt[k]) { keys.push(k); total += cnt[k]; }
    const boxes = [{ keys, total }];
    while (boxes.length < 255) {
      let bi = -1, best = -1;
      for (let i = 0; i < boxes.length; i++) {
        if (boxes[i].keys.length > 1 && boxes[i].total > best) { best = boxes[i].total; bi = i; }
      }
      if (bi < 0) break;
      const bx = boxes[bi];
      let rmin = 31, rmax = 0, gmin = 31, gmax = 0, bmin = 31, bmax = 0;
      for (const k of bx.keys) {
        const r = k >> 10, g = (k >> 5) & 31, b = k & 31;
        if (r < rmin) rmin = r; if (r > rmax) rmax = r;
        if (g < gmin) gmin = g; if (g > gmax) gmax = g;
        if (b < bmin) bmin = b; if (b > bmax) bmax = b;
      }
      const rr = rmax - rmin, gr = gmax - gmin, br = bmax - bmin;
      const sh = (gr >= rr && gr >= br) ? 5 : (rr >= br ? 10 : 0);
      bx.keys.sort((a, b) => ((a >> sh) & 31) - ((b >> sh) & 31));
      let acc = 0, split = 1;
      const half = bx.total / 2;
      for (let i = 0; i < bx.keys.length - 1; i++) {
        acc += cnt[bx.keys[i]]; split = i + 1;
        if (acc >= half) break;
      }
      boxes.splice(bi, 1,
        { keys: bx.keys.slice(0, split), total: acc },
        { keys: bx.keys.slice(split), total: bx.total - acc });
    }
    const pal = new Uint8Array(256 * 3);
    boxes.forEach((bx, i) => {
      let n = 0, r = 0, g = 0, b = 0;
      for (const k of bx.keys) { n += cnt[k]; r += sr[k]; g += sg[k]; b += sb[k]; }
      if (n) { pal[i*3] = Math.round(r / n); pal[i*3+1] = Math.round(g / n); pal[i*3+2] = Math.round(b / n); }
    });
    return { pal, n: boxes.length };
  }

  function lzwEncode(px, next){
    const out = [];
    let cur = 0, shift = 0, size = 9, nc = 258;
    next.fill(0);
    const emit = c => {
      cur |= c << shift; shift += size;
      while (shift >= 8) { out.push(cur & 255); cur >>>= 8; shift -= 8; }
    };
    emit(256);
    let ib = px[0];
    for (let i = 1; i < px.length; i++) {
      const k = px[i], key = (ib << 8) | k, c = next[key];
      if (c) { ib = c; continue; }
      emit(ib);
      if (nc === 4096) { emit(256); nc = 258; size = 9; next.fill(0); }
      else { if (nc >= (1 << size)) size++; next[key] = nc++; }
      ib = k;
    }
    emit(ib); emit(257);
    if (shift > 0) out.push(cur & 255);
    return out;
  }

  function frameBytes(px, w, h, delay, next){
    const lz = lzwEncode(px, next);
    const b = [0x21, 0xF9, 0x04, 0x05, delay & 255, delay >> 8, 255, 0,
               0x2C, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0, 8];
    for (let i = 0; i < lz.length; i += 255) {
      const n = Math.min(255, lz.length - i);
      b.push(n);
      for (let j = 0; j < n; j++) b.push(lz[i + j]);
    }
    b.push(0);
    return new Uint8Array(b);
  }

  /* ---------- 변환 UI ---------- */
  function plan(){
    const a = parseFloat($('gStart').value) || 0;
    const b = parseFloat($('gEnd').value) || 0;
    let n = Math.max(1, Math.floor((b - a) * S.fps));
    const capped = n > MAX_FRAMES;
    n = Math.min(n, MAX_FRAMES);
    const w = Math.min(S.gw, video.videoWidth || S.gw);
    const h = Math.round(w * (video.videoHeight || 1) / (video.videoWidth || 1));
    return { a, b, n, w, h, capped };
  }
  function updateInfo(){
    if (kind !== 'video') return;
    const p = plan();
    $('gInfo').textContent = `${p.n}프레임 · ${p.w}×${p.h}px · 약 ${(p.n / S.fps).toFixed(1)}초` + (p.capped ? ` (최대 ${MAX_FRAMES}프레임으로 제한)` : '');
  }
  function clampRange(){
    const dur = video.duration || 0;
    let a = parseFloat($('gStart').value) || 0;
    let b = parseFloat($('gEnd').value) || 0;
    a = Math.max(0, Math.min(a, dur - 0.1));
    b = Math.max(a + 0.1, Math.min(b, dur));
    $('gStart').value = a.toFixed(1);
    $('gEnd').value = b.toFixed(1);
    updateInfo();
    render();
  }
  $('gStart').addEventListener('change', clampRange);
  $('gEnd').addEventListener('change', clampRange);
  $('setStart').addEventListener('click', () => { $('gStart').value = video.currentTime.toFixed(1); clampRange(); });
  $('setEnd').addEventListener('click', () => { $('gEnd').value = video.currentTime.toFixed(1); clampRange(); });

  function clearGif(){
    if (gifUrl) URL.revokeObjectURL(gifUrl);
    gifUrl = null; gifBlob = null;
    $('gifRes').classList.add('hide');
    $('gifImg').removeAttribute('src');
  }

  function seekTo(t){
    return new Promise(res => {
      const target = Math.max(0, Math.min(t, video.duration - 0.05));
      if (Math.abs(video.currentTime - target) < 0.001) return res();
      let done = false;
      const fin = () => { if (done) return; done = true; video.removeEventListener('seeked', fin); clearTimeout(to); res(); };
      const to = setTimeout(fin, 3000);
      video.addEventListener('seeked', fin);
      video.currentTime = target;
    });
  }
  const tick = () => new Promise(r => setTimeout(r, 0));

  function setProg(p, text){
    $('bar').style.width = Math.round(p * 100) + '%';
    $('progT').textContent = text;
  }

  async function makeGif(){
    if (exporting || kind !== 'video') return;
    const p = plan();
    exporting = true; cancelFlag = false;
    clearGif();
    $('mkGif').disabled = true;
    $('progBox').classList.remove('hide');
    const snap = { ...S };
    const st = stamp();
    const returnTo = parseFloat($('scrub').value) || 0;

    try {
      const oc = document.createElement('canvas');
      oc.width = p.w; oc.height = p.h;
      const octx = oc.getContext('2d', { willReadFrequently: true });
      const timeAt = i => p.a + i / snap.fps;
      const grab = async i => {
        await seekTo(timeAt(i));
        paint(octx, video, p.w, p.h, snap, st, i / snap.fps, p.n > 1 ? i / (p.n - 1) : 0);
        return octx.getImageData(0, 0, p.w, p.h).data;
      };

      // 1) 팔레트용 샘플 프레임
      const nS = Math.min(p.n, 8), samples = [];
      for (let i = 0; i < nS; i++) {
        if (cancelFlag) throw 'cancel';
        samples.push(await grab(Math.floor(i * p.n / nS)));
        setProg(0.1 * (i + 1) / nS, '색상 분석 중…');
        await tick();
      }
      const { pal, n: nPal } = buildPalette(samples);
      samples.length = 0;
      const lut = new Int16Array(32768).fill(-1);
      const mapPx = (r, g, b) => {
        const k = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
        let v = lut[k];
        if (v >= 0) return v;
        let best = 0, bd = 1e9;
        for (let i = 0; i < nPal; i++) {
          const dr = r - pal[i*3], dg = g - pal[i*3+1], db = b - pal[i*3+2];
          const dd = dr*dr + dg*dg + db*db;
          if (dd < bd) { bd = dd; best = i; }
        }
        lut[k] = best;
        return best;
      };

      // 2) 헤더
      const delay = Math.max(2, Math.round(100 / snap.fps));
      const parts = [];
      parts.push(new Uint8Array([71,73,70,56,57,97, p.w & 255, p.w >> 8, p.h & 255, p.h >> 8, 0xF7, 0, 0]));
      parts.push(pal);
      parts.push(new Uint8Array([0x21,0xFF,0x0B, 78,69,84,83,67,65,80,69,50,46,48, 3,1,0,0,0]));

      // 3) 프레임 인코딩
      const next = new Uint16Array(4096 * 256);
      let prev = null;
      for (let i = 0; i < p.n; i++) {
        if (cancelFlag) throw 'cancel';
        const d = await grab(i);
        const idx = new Uint8Array(p.w * p.h);
        for (let q = 0, o = 0; q < idx.length; q++, o += 4) idx[q] = mapPx(d[o], d[o+1], d[o+2]);
        let outPx = idx;
        if (prev) {
          outPx = new Uint8Array(idx.length);
          for (let q = 0; q < idx.length; q++) outPx[q] = idx[q] === prev[q] ? 255 : idx[q];
        }
        prev = idx;
        parts.push(frameBytes(outPx, p.w, p.h, delay, next));
        setProg(0.1 + 0.9 * (i + 1) / p.n, `프레임 ${i + 1} / ${p.n}`);
        await tick();
      }
      parts.push(new Uint8Array([0x3B]));

      gifBlob = new Blob(parts, { type: 'image/gif' });
      gifUrl = URL.createObjectURL(gifBlob);
      $('gifImg').src = gifUrl;
      $('gifMeta').textContent = `${p.w} × ${p.h}px · ${p.n}프레임 · ${(gifBlob.size / 1048576).toFixed(2)}MB`;
      $('gifRes').classList.remove('hide');
      setProg(1, '완료!');
      toast('GIF를 만들었어요');
      setTimeout(() => $('gifRes').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
    } catch (e) {
      if (e === 'cancel') toast('변환을 취소했어요');
      else { console.error(e); toast('변환 중 오류가 났어요. 너비나 구간을 줄여보세요'); }
    } finally {
      exporting = false;
      $('mkGif').disabled = false;
      $('progBox').classList.add('hide');
      video.currentTime = returnTo;
    }
  }
  $('mkGif').addEventListener('click', makeGif);
  $('cancelGif').addEventListener('click', () => { cancelFlag = true; });

  $('gifDl').addEventListener('click', () => {
    if (!gifUrl) return;
    download(gifUrl, `${fileName}_wm.gif`);
    toast('저장했어요');
  });
  $('gifShare').addEventListener('click', async () => {
    if (!gifBlob) return;
    try { await navigator.share({ files: [new File([gifBlob], `${fileName}_wm.gif`, { type: 'image/gif' })] }); }
    catch(e) { if (e.name !== 'AbortError') toast('공유에 실패했어요'); }
  });

  /* ---------- toast ---------- */
  let tt;
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800);
  }

  syncUI();
})();
</script>
</body>
</html>
